<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Todo + Notes App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    *{box-sizing:border-box;font-family:system-ui}
    body{
      margin:0;
      background:#f3f4f6;
      display:flex;
      justify-content:center;
      padding:40px 10px;
    }
    .container{
      max-width:1100px;
      width:100%;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }
    .card{
      background:#fff;
      border-radius:20px;
      padding:20px;
      box-shadow:0 10px 25px rgba(0,0,0,.08);
      animation:fadeIn .6s ease;
    }
    h2{margin:0 0 15px}
    .row{display:flex;gap:10px;margin-bottom:10px}
    input,textarea{
      width:100%;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid #d1d5db;
      font-size:15px;
    }
    button{
      border:0;
      border-radius:12px;
      cursor:pointer;
      font-size:14px;
    }
    .btn{
      background:#000;
      color:#fff;
      padding:10px 14px;
    }
    .task{
      display:flex;
      justify-content:space-between;
      align-items:center;
      border:1px solid #e5e7eb;
      padding:10px;
      border-radius:12px;
      margin-top:6px;
      animation:slideUp .4s ease;
    }
    .task.done span{ text-decoration:line-through;color:#9ca3af}
    .circle{
      width:20px;height:20px;border-radius:50%;
      border:1px solid #9ca3af;
      cursor:pointer;
    }
    .delete{color:#ef4444;background:none}
    .note{
      border:1px solid #e5e7eb;
      padding:12px;
      border-radius:12px;
      margin-top:8px;
      position:relative;
      animation:slideUp .4s ease;
    }
    .note button{
      position:absolute;
      top:8px;
      right:8px;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}}
    @keyframes slideUp{from{opacity:0;transform:translateY(10px)}}
    @media(max-width:800px){
      .container{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Tasks -->
    <div class="card">
      <h2>Tasks</h2>

      <div class="row">
        <input id="taskInput" placeholder="Add a new task..." />
        <button class="btn" onclick="addTask()">Add</button>
      </div>

      <div id="taskList"></div>
    </div>

    <!-- Notes -->
    <div class="card">
      <h2>Notes</h2>

      <textarea id="noteInput" placeholder="Write a note..." rows="4"></textarea>
      <button class="btn" style="width:100%;margin-top:8px" onclick="addNote()">Save Note</button>

      <div id="noteList"></div>
    </div>

  </div>

<script>
  const taskInput = document.getElementById("taskInput");
  const taskList = document.getElementById("taskList");
  const noteInput = document.getElementById("noteInput");
  const noteList = document.getElementById("noteList");

  function addTask(){

    if(!taskInput.value.trim()) return;

    const div = document.createElement("div");
    div.className = "task";
    div.innerHTML = `
      <div onclick="this.parentElement.classList.toggle('done')" class="circle"></div>
      <span>${taskInput.value}</span>
      <button class="delete" onclick="this.parentElement.remove()">Delete</button>
    `;
    taskList.prepend(div);
    taskInput.value = "";
  }

  function addNote(){
    if(!noteInput.value.trim()) return;

    const div = document.createElement("div");
    div.className = "note";
    div.innerHTML = `
      <button class="delete" onclick="this.parentElement.remove()">Delete</button>
      <p>${noteInput.value}</p>
    `;
    noteList.prepend(div);
    noteInput.value = "";
  }
</script>

</body>
</html>
